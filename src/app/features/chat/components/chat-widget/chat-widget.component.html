<!-- NÚT NỔI FLOATING ACTION BUTTON Ở GÓC DƯỚI BÊN PHẢI -->
<div class="chat-widget-fab-container">
  @if (!isOpen()) {
    <button
      type="button"
      class="chat-widget-fab"
      (click)="toggleChat()"
      aria-label="Mở Trợ lý AI Tư Vấn Tuyển Sinh"
    >
      <span class="fab-icon-bubble">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </span>
      <span class="fab-label">Hỏi AI Tuyển Sinh</span>
      <span class="fab-pulse-dot" aria-hidden="true"></span>
    </button>
  }
</div>

<!-- HỘP THOẠI CHATBOT POPUP -->
@if (isOpen()) {
  <div class="chat-window" role="dialog" aria-labelledby="chat-window-title">
    <!-- HEADER -->
    <div class="chat-header">
      <div class="chat-header__left">
        <div class="chat-header__avatar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2a7 7 0 0 1 7 7v1a7 7 0 0 1-14 0V9a7 7 0 0 1 7-7z"/>
            <path d="M9 17v1a3 3 0 0 0 6 0v-1"/>
            <circle cx="12" cy="9" r="1" fill="white"/>
            <path d="M10 11a2 2 0 0 1 4 0"/>
          </svg>
        </div>
        <div class="chat-header__info">
          <h2 id="chat-window-title" class="chat-header__title">AI Tư Vấn Tuyển Sinh</h2>
          <div class="chat-header__badge">
            <span class="status-dot"></span>
            <span>GraphRAG • GDPT 2018</span>
          </div>
        </div>
      </div>

      <div class="chat-header__actions">
        <!-- Nút Xóa lịch sử -->
        <button
          type="button"
          class="chat-header__btn"
          (click)="clear()"
          title="Xóa cuộc trò chuyện"
          aria-label="Xóa cuộc trò chuyện"
        >
          🗑️
        </button>

        <!-- Nút Thu nhỏ / Đóng -->
        <button
          type="button"
          class="chat-header__btn chat-header__btn--close"
          (click)="closeChat()"
          title="Đóng cửa sổ chat"
          aria-label="Đóng chat"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- KHUNG HIỂN THỊ TIN NHẮN -->
    <div class="chat-messages" #chatMessages>
      @for (msg of chatService.messages(); track msg.id) {
        <div
          class="message"
          [class.user-msg]="msg.role === 'user'"
          [class.bot-msg]="msg.role === 'assistant'"
          [class.error-msg]="msg.isError"
        >
          @if (msg.role === 'assistant') {
            <div class="markdown-content" [innerHTML]="msg.content | markdown"></div>
          } @else {
            <div class="user-content">{{ msg.content }}</div>
          }
        </div>
      }

      <!-- THINKING INDICATOR -->
      @if (chatService.isLoading()) {
        <div class="thinking-indicator" aria-label="AI đang suy nghĩ...">
          <div class="thinking-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span class="thinking-text">AI đang tra cứu dữ liệu tuyển sinh...</span>
        </div>
      }
    </div>

    <!-- KHUNG NHẬP LIỆU -->
    <div class="chat-input-area">
      <input
        type="text"
        class="chat-input"
        placeholder="Nhập câu hỏi (vd: Điểm chuẩn CNTT Quy Nhơn)..."
        [value]="inputText()"
        (input)="inputText.set($any($event.target).value)"
        (keydown)="handleKeyDown($event)"
        [disabled]="chatService.isLoading()"
      />
      <button
        type="button"
        class="send-btn"
        (click)="send()"
        [disabled]="!inputText().trim() || chatService.isLoading()"
        title="Gửi câu hỏi"
        aria-label="Gửi tin nhắn"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
}
