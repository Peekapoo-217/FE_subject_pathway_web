<div class="chat-panel-card" role="region" aria-label="Khung tư vấn AI">
  <!-- HEADER -->
  <div class="chat-panel-header">
    <div class="chat-panel-header__left">
      <div class="chat-panel-header__avatar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2a7 7 0 0 1 7 7v1a7 7 0 0 1-14 0V9a7 7 0 0 1 7-7z" />
          <path d="M9 17v1a3 3 0 0 0 6 0v-1" />
          <circle cx="12" cy="9" r="1" fill="white" />
          <path d="M10 11a2 2 0 0 1 4 0" />
        </svg>
      </div>
      <div class="chat-panel-header__info">
        <h3 class="chat-panel-header__title">AI Tuyển Sinh &amp; Hướng Nghiệp</h3>
        <div class="chat-panel-header__badge">
          <span class="status-dot"></span>
          <span>Knowledge Graph (Neo4j) Connected • GDPT 2018</span>
        </div>
      </div>
    </div>

    <div class="chat-panel-header__actions">
      <!-- Nút Xóa lịch sử -->
      <button type="button" class="panel-action-btn" (click)="clear()" title="Xóa cuộc trò chuyện"
        aria-label="Xóa cuộc trò chuyện">
        <span class="btn-text">Làm mới</span>
      </button>
    </div>
  </div>

  <!-- MESSAGES AREA -->
  <div class="chat-panel-messages" #chatMessages>
    @for (msg of chatService.messages(); track msg.id) {
    <div class="message" [class.user-msg]="msg.role === 'user'" [class.bot-msg]="msg.role === 'assistant'"
      [class.error-msg]="msg.isError">
      @if (msg.role === 'assistant') {
      <div class="markdown-content" [innerHTML]="msg.content | markdown"></div>
      } @else {
      <div class="user-content">{{ msg.content }}</div>
      }
    </div>
    }

    <!-- THINKING INDICATOR -->
    @if (chatService.isLoading()) {
    <div class="thinking-indicator" aria-label="AI đang suy nghĩ...">
      <div class="thinking-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <span class="thinking-text">AI đang tra cứu dữ liệu tuyển sinh &amp; đồ thị tri thức...</span>
    </div>
    }
  </div>

  <!-- INPUT AREA -->
  <div class="chat-panel-input-area">
    <input type="text" class="panel-input"
      placeholder="Hỏi bất kỳ điều gì về ngành học, trường đại học hoặc cách chọn tổ hợp môn..." [value]="inputText()"
      (input)="inputText.set($any($event.target).value)" (keydown)="handleKeyDown($event)"
      [disabled]="chatService.isLoading()" />
    <button type="button" class="send-btn" (click)="send()" [disabled]="!inputText().trim() || chatService.isLoading()"
      title="Gửi câu hỏi" aria-label="Gửi câu hỏi">
      <span class="send-btn__text">Gửi câu hỏi</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>
